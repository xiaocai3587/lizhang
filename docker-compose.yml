version: '3.8'

services:
  backend:
    build: ./backend
    container_name: lizhang-backend
    ports:
      - "8000:8000"
    volumes:
      - lizhang-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/lizhang.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lizhang-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lizhang-data:
